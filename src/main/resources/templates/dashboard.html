<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Smart Traffic Dashboard</title>

    <!-- Leaflet for OpenStreetMap -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: Arial; padding:20px; }
        table { width:100%; border-collapse:collapse; margin-bottom:30px; }
        th, td { padding:10px; border:1px solid #ddd; text-align:center; }
        th { background:#4CAF50; color:#fff; }
        tr:nth-child(even){ background:#f7f7f7; }
        #map { height:400px; width:100%; margin-top:30px; }
        select, button { padding:8px 12px; font-size:14px; }
        h2, h3 { margin-bottom: 10px; }
    </style>
</head>
<body>

<h2>🚦 Smart Traffic Signal Dashboard</h2>

<!-- Dashboard Table -->
<table>
    <thead>
    <tr>
        <th>Intersection</th>
        <th>Congestion (%)</th>
        <th>Green (s)</th>
        <th>Red (s)</th>
        <th>Yellow (s)</th>
        <th>History</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="d : ${dashboardData}">
        <td th:text="${d.intersection}">Name</td>
        <td th:text="${d.congestion}">0</td>
        <td th:text="${d.green}">0</td>
        <td th:text="${d.red}">0</td>
        <td th:text="${d.yellow}">0</td>
        <td><a th:href="@{'/signal-history-dashboard/' + ${d.id}}">View</a></td>
    </tr>
    </tbody>
</table>

<!-- Quick History Selector -->
<h3>📊 Quick History View</h3>
<form onsubmit="return goToHistory();">
    <select id="intersectionId">
        <option disabled selected>-- Select Intersection --</option>
        <option th:each="d : ${dashboardData}"
                th:value="${d.id}"
                th:text="${d.intersection}"></option>
    </select>
    <button type="submit">Go</button>
</form>

<!-- Map Section -->
<h3>🗺️ Intersection Map</h3>
<div id="map"></div>

<script th:inline="javascript">
    const dashboardData = /*[[${dashboardData}]]*/ [];

    // Auto-refresh every 10 seconds
    setInterval(() => location.reload(), 10000);

    // Redirect to signal history page
    function goToHistory() {
        const id = document.getElementById("intersectionId").value;
        if (!id) return false;
        window.location.href = "/signal-history-dashboard/" + id;
        return false;
    }

    // Initialize map with markers
    function initMap() {
        let centerLat = 28.6139, centerLng = 77.2090;
        if (dashboardData.length > 0 && dashboardData[0].latitude && dashboardData[0].longitude) {
            centerLat = dashboardData[0].latitude;
            centerLng = dashboardData[0].longitude;
        }
        const map = L.map('map').setView([centerLat, centerLng], 13);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        dashboardData.forEach(d => {
            if (d.latitude && d.longitude) {
                const marker = L.marker([d.latitude, d.longitude]).addTo(map);
                marker.bindPopup(
                    `<strong>${d.intersection}</strong><br>
                     Green: ${d.green}s<br>
                     Red: ${d.red}s<br>
                     Yellow: ${d.yellow}s<br>
                     Congestion: ${d.congestion}%<br>
                     <a href="/signal-history-dashboard/${d.id}">History</a>`
                );
            }
        });
    }

    window.onload = initMap;
</script>

</body>
</html>
